<mat-card>
  <mat-card-header>
    <mat-card-title>{{ module.name }}</mat-card-title>
    <mat-card-subtitle>{{ module.description }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="permissions">
      <h3>Permissions:</h3>
      <mat-chip-set>
        @for (permission of module.permissions; track permission) {
          <mat-chip >
            {{ permission.name }}
          </mat-chip>
        }
      </mat-chip-set>
    </div>
  </mat-card-content>
</mat-card>
