<div class="container mt-4">
	<div class="row mb-3">
		<div class="col-md-4">
			<input type="text" class="form-control" (keyup)="applyFilter($event)" placeholder="Filter users (Ex. Mia)"
				#input>
		</div>
	</div>

	<div class="row">
		<div class="col-12">
			<table class="table table-striped table-hover shadow-sm">
				<thead>
					<tr>
						<th scope="col">ID</th>
						<th scope="col">Name</th>
						<th scope="col">User Name</th>
						<th scope="col">Email</th>
					</tr>
				</thead>
				<tbody>
					@for (user of users; track user.id) {
					<tr>
						<td>{{user.id}}</td>
						<td>{{user.fullName}}</td>
						<td>{{user.username}}</td>
						<td>{{user.email}}</td>
					</tr>
					}
					@if (users.length === 0) {
					<tr>
						<td colspan="4" class="text-center">No data matching the filter "{{input.value}}"</td>
					</tr>
					}
				</tbody>
			</table>
		</div>
	</div>
</div>
