<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (space of spaces; track space) {
    <div class="col">
      <div class="card h-100 shadow-sm" (click)="goToSpaceDetails(space.id)" style="cursor: pointer;">
        <img [src]="space.thumbnail" class="card-img-top" alt="{{ space.name }}"
          style="height: 200px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title">{{ space.name }}</h5>
          <div class="rating text-warning">
            @for (star of [].constructor(5); track $index; let starIndex = $index) {
            <span>
              @if (starIndex < space.rating) { ★ } @if (starIndex>= space.rating) {
                ☆
                }
            </span>
            }
          </div>
        </div>
        <div class="card-footer bg-transparent border-top-0 d-flex justify-content-end">
          <button class="btn btn-outline-danger btn-sm" (click)="toggleFavorite(space); $event.stopPropagation()">
            @if (space.favorite) {
            ♥
            }
            @if (!space.favorite) {
            ♡
            }
          </button>
        </div>
      </div>
    </div>
    }
  </div>
</div>
