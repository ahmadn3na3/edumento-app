<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <div class="bg-light border-end" id="sidebar-wrapper" [class.d-none]="!isSidebarOpen">
    <div class="sidebar-heading border-bottom bg-light p-3">Edumento</div>
    <div class="list-group list-group-flush">
      <a routerLink="/modules" class="list-group-item list-group-item-action list-group-item-light p-3">Modules</a>
      <a routerLink="/users" class="list-group-item list-group-item-action list-group-item-light p-3">Users</a>
      <a routerLink="/categories"
        class="list-group-item list-group-item-action list-group-item-light p-3">Categories</a>
      <a (click)="logout()" class="list-group-item list-group-item-action list-group-item-light p-3"
        style="cursor: pointer;">Logout</a>
    </div>
  </div>
  <!-- Page Content -->
  <div id="page-content-wrapper" class="w-100">
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
      <div class="container-fluid">
        <button class="btn btn-primary" id="sidebarToggle" (click)="toggleSidebar()">Toggle Menu</button>
      </div>
    </nav>
    <div class="container-fluid p-3">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
